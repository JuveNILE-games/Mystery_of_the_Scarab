name: SonarQube

on:
  push:
    branches:
      - master

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # ---------------------------------------------------------------------
      # Read Unity version
      # ---------------------------------------------------------------------
      - name: Parse Unity version
        id: read
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' \
            ProjectSettings/ProjectVersion.txt)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Cache Unity Library
      # ---------------------------------------------------------------------
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # ---------------------------------------------------------------------
      # Free disk space
      # ---------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL

          sudo docker image prune --all --force

          df -h /

      # ---------------------------------------------------------------------
      # Generate solution and project files
      # ---------------------------------------------------------------------
      - name: Generate solution
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.read.outputs.version }}
          targetPlatform: StandaloneLinux64
          buildMethod: Packages.Rider.Editor.RiderScriptEditor.SyncSolution
          allowDirtyBuild: true
          versioning: None
          customImage: unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3

      # ---------------------------------------------------------------------
      # Verify generated solution
      # ---------------------------------------------------------------------
      - name: Verify generated files
        run: |
          echo "=== Generated files ==="

          find . -maxdepth 1 \
            \( -name "*.sln" -o -name "*.csproj" \) \
            -print

          echo ""
          echo "Total: $(find . -maxdepth 1 \( -name '*.sln' -o -name '*.csproj' \) | wc -l) files"

          ls *.sln || {
            echo "No .sln found!"
            exit 1
          }

      # ---------------------------------------------------------------------
      # Create patch script
      # ---------------------------------------------------------------------
      - name: Write project patch script
        run: |
          cat > patch_projects.py << 'PYEOF'
          import re
          import os
          import glob

          # Which EXACT projects are "first-party" for THIS analysis pass (kept as source, so
          # Sonar actually analyzes them) vs "third-party" (deleted and DLL-referenced instead,
          # so they still compile but aren't analyzed or counted for LOC).
          # Set per-pass via the SONAR_FIRST_PARTY env var — see the SonarQube analysis step.
          #
          # Exact match, NOT prefix: Unity generates separate .csproj per assembly-definition
          # variant (JuveNILE.Core, JuveNILE.Core.Editor, JuveNILE.Core.Player, ...), and most of
          # them compile largely the SAME underlying .cs files for different platform/editor
          # contexts. A prefix match like "JuveNILE.Core" would keep all of those variants as
          # first-party and Sonar would count the same physical lines 3-4x over. Only the single
          # canonical runtime assembly per component is analyzed; its Editor/Player siblings are
          # treated as third-party (still built via DLL reference, just not re-analyzed).
          FIRST_PARTY = frozenset(
              p for p in os.environ.get(
                  'SONAR_FIRST_PARTY',
                  'MysteryOfTheScarab,MysteryOfTheScarab.Net'
              ).split(',') if p
          )

          def is_first_party(name):
              return name in FIRST_PARTY

          all_projs = {f[:-7] for f in glob.glob('*.csproj')}
          first_party = {n for n in all_projs if is_first_party(n)}
          third_party = all_projs - first_party

          print(f'\nFirst-party ({len(first_party)}): {sorted(first_party)}')
          print(f'Third-party ({len(third_party)}): {sorted(third_party)}\n')

          print('Building DLL index...')

          dll_index = {}

          for pattern in [
              'Library/ScriptAssemblies/*.dll',
              'Library/PackageCache/**/*.dll',
              'Assets/**/*.dll',
          ]:
              for path in glob.glob(pattern, recursive=True):
                  name = os.path.splitext(os.path.basename(path))[0]

                  if (
                      name not in dll_index
                      or os.path.getsize(path)
                      > os.path.getsize(dll_index[name])
                  ):
                      dll_index[name] = path

          print(f'Indexed {len(dll_index)} assemblies\n')

          for name in third_party:
              os.remove(f'{name}.csproj')
              print(f'  Deleted: {name}.csproj')

          def patch_refs(content):
              def replace(match):
                  dep = match.group(1)

                  if is_first_party(dep):
                      return match.group(0)

                  if dep in dll_index:
                      path = dll_index[dep]
                      size = os.path.getsize(path)

                      print(
                          f'  Ref: {dep} -> {path} ({size} bytes)'
                      )

                      return (
                          f'<Reference Include="{dep}">'
                          f'<HintPath>{path}</HintPath>'
                          f'</Reference>'
                      )

                  print(f'  WARNING: No DLL found for {dep}')
                  return ''

              return re.sub(
                  r'<ProjectReference\s+Include="([^"]+)\.csproj"\s*(?:/>|>.*?</ProjectReference>)',
                  replace,
                  content,
                  flags=re.DOTALL
              )

          for name in first_party:
              csproj = f'{name}.csproj'

              if not os.path.exists(csproj):
                  continue

              with open(csproj) as f:
                  content = f.read()

              with open(csproj, 'w') as f:
                  f.write(patch_refs(content))

              print(f'  Patched: {csproj}')

          for sln in glob.glob('*.sln'):
              with open(sln) as f:
                  content = f.read()

              def keep_block(match):
                  hit = re.search(
                      r'"([^"]+\.csproj)"',
                      match.group(0)
                  )

                  if hit and not os.path.exists(hit.group(1)):
                      return ''

                  return match.group(0)

              with open(sln, 'w') as f:
                  f.write(
                      re.sub(
                          r'Project\([^)]*\)\s*=\s*"[^"]*",\s*"[^"]*\.csproj".*?EndProject\n',
                          keep_block,
                          content,
                          flags=re.DOTALL
                      )
                  )

              print(f'  Cleaned .sln: {sln}')

          print('\nRemaining projects:')

          for f in sorted(glob.glob('*.csproj')):
              print(f'  {f}')
          PYEOF

      # ---------------------------------------------------------------------
      # SonarCloud Analysis
      # ---------------------------------------------------------------------
      # Three separate analyses from one checkout/build (monorepo-style): the main game
      # project, plus Assets/Core and Assets/NetCore under their own SonarCloud projects
      # and tokens. All three csproj stay in the built solution (Core/NetCore code is a real
      # dependency of the main project and needs to actually compile), sonar.sources/
      # sonar.exclusions is what scopes each pass to its own slice of the same source tree.
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CORE_SONAR_TOKEN: ${{ secrets.CORE_SONAR_TOKEN }}
          NETCORE_SONAR_TOKEN: ${{ secrets.NETCORE_SONAR_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            -e SONAR_TOKEN \
            -e CORE_SONAR_TOKEN \
            -e NETCORE_SONAR_TOKEN \
            unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3 \
            bash -c '
              set -euo pipefail

              echo "Installing Java 17..."
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                openjdk-17-jre-headless

              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

              echo "Installing .NET SDK 8..."
              wget -q https://dot.net/v1/dotnet-install.sh \
                -O /tmp/dotnet-install.sh

              chmod +x /tmp/dotnet-install.sh

              /tmp/dotnet-install.sh \
                --channel 8.0 \
                --install-dir /usr/share/dotnet

              export PATH="/usr/share/dotnet:$PATH"
              export DOTNET_ROOT="/usr/share/dotnet"

              echo "Installing SonarScanner..."
              cd /tmp
              dotnet tool install \
                dotnet-sonarscanner \
                --tool-path /sonarscanner

              cd /github/workspace

              # Snapshot the freshly-generated, unpatched *.csproj/*.sln once. Each pass below
              # restores from here first: patch_projects.py deletes "third-party" (for that pass)
              # csproj and rewrites the .sln in place, which is a one-way operation — without
              # restoring between passes, pass 2 would find pass 1'"'"'s already-deleted files gone.
              mkdir -p /tmp/proj-backup
              cp *.csproj *.sln /tmp/proj-backup/

              SLN_FILE=$(find . -maxdepth 1 -name "*.sln" | head -n 1)

              run_pass () {
                local pass_name="$1"
                local project_key="$2"
                local token="$3"
                local first_party="$4"
                local sources="$5"
                local exclusions="$6"

                echo "=== SonarCloud analysis: $pass_name ==="

                echo "Restoring unpatched project files..."
                rm -f *.csproj *.sln
                cp /tmp/proj-backup/*.csproj /tmp/proj-backup/*.sln .

                echo "Cleaning Unity compiler overrides..."
                sed -i "/<Analyzer Include=.*Editor\/Data\/Tools/d" *.csproj
                sed -i "/<Analyzer Include=.*YarnSpinner.*SourceCodeGenerator/d" *.csproj
                sed -i "/<CscToolExe>/d" *.csproj
                sed -i "/<CscToolPath>/d" *.csproj

                echo "Forcing SonarScanner to treat Unity projects as production code..."
                for file in *.csproj; do
                  sed -i "0,/<PropertyGroup>/s//<PropertyGroup>\n    <SonarQubeTestProject>false<\/SonarQubeTestProject>/" "$file"
                done

                echo "Patching project references (first-party: $first_party)..."
                SONAR_FIRST_PARTY="$first_party" python3 /github/workspace/patch_projects.py

                /sonarscanner/dotnet-sonarscanner begin \
                  /k:"$project_key" \
                  /o:"juvenile-games" \
                  /d:sonar.token="$token" \
                  /d:sonar.host.url="https://sonarcloud.io" \
                  /d:sonar.sources="$sources" \
                  /d:sonar.exclusions="$exclusions"

                dotnet build "$SLN_FILE" --configuration Debug --no-incremental

                /sonarscanner/dotnet-sonarscanner end \
                  /d:sonar.token="$token"
              }

              # Main pass: Core/NetCore (and their Editor/Player variants) treated as third-party
              # (DLL-referenced, not analyzed) — sonar.exclusions alone was not enough for .cs
              # files, since the .NET scanner counts LOC per built project regardless of file
              # globs. sonar.sources is scoped explicitly per pass too — it was previously left at
              # its Assets-wide default for every pass, so non-C# files (.meta/.asset/.prefab)
              # were being scanned from the whole tree every time regardless of project scoping.
              run_pass "Mystery_of_the_Scarab" "JuveNILE-games_Mystery_of_the_Scarab" "$SONAR_TOKEN" \
                "MysteryOfTheScarab,MysteryOfTheScarab.Net,Assembly-CSharp" \
                "Assets" \
                "**/Library/**,**/Temp/**,**/obj/**,**/Logs/**,**/UserSettings/**,**/Audio/**,Assets/Core/**,Assets/NetCore/**"

              run_pass "Core" "JuveNILE-games_Core" "$CORE_SONAR_TOKEN" \
                "JuveNILE.Core" \
                "Assets/Core" \
                "**/Library/**,**/Temp/**,**/obj/**"

              run_pass "NetCore" "JuveNILE-games_NetCore" "$NETCORE_SONAR_TOKEN" \
                "JuveNILE.NetCore" \
                "Assets/NetCore" \
                "**/Library/**,**/Temp/**,**/obj/**"

              echo "Cleaning up patch script..."
              rm -f /github/workspace/patch_projects.py
            '

  test:
    name: Run EditMode tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Parse Unity version
        id: read
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' \
            ProjectSettings/ProjectVersion.txt)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.read.outputs.version }}
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EditMode test results
          path: test-results
