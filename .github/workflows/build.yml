name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate-solution:
    name: Generate Unity solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Parse Unity version
        id: read
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' \
                   ProjectSettings/ProjectVersion.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                       /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Generate solution
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.read.outputs.version }}
          targetPlatform: StandaloneLinux64
          buildMethod: Packages.Rider.Editor.RiderScriptEditor.SyncSolution
          allowDirtyBuild: true
          versioning: None
          customImage: unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3

      - name: List generated files
        if: always()
        run: |
          echo "=== .sln and .csproj files ==="
          find . -maxdepth 2 \( -name "*.sln" -o -name "*.csproj" \) -print
          echo ""
          echo "=== Root listing ==="
          ls -la *.sln *.csproj 2>/dev/null || echo "None at root"

      - name: Upload solution files
        uses: actions/upload-artifact@v4
        with:
          name: solution-files
          retention-days: 1
          path: |
            *.sln
            **/*.csproj

  analyze:
    name: Build and analyze
    needs: generate-solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Download solution files
        uses: actions/download-artifact@v4
        with:
          name: solution-files

      - name: Verify solution files
        run: find . -maxdepth 2 \( -name "*.sln" -o -name "*.csproj" \) -print

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dotnet-sonarscanner
        run: dotnet tool install dotnet-sonarscanner --tool-path ./sonarscanner

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./sonarscanner/dotnet-sonarscanner begin \
            /k:"JuveNILE-games_Mystery_of_the_Scarab" \
            /o:"juvenile-games" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="**/Library/**,**/Temp/**,**/obj/**,**/Logs/**,**/UserSettings/**,**/Audio/**" \
            /d:sonar.sources="Assets"

      - name: Build
        run: |
          SLN_FILE=$(find . -maxdepth 1 -name "*.sln" | head -n 1)
          [ -n "$SLN_FILE" ] || { echo "No .sln found"; exit 1; }
          echo "Building $SLN_FILE"
          dotnet build "$SLN_FILE" --configuration Debug

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./sonarscanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
