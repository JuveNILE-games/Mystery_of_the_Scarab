name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Parse Unity version
        id: read
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' \
                   ProjectSettings/ProjectVersion.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                       /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      # Step 1: Generate .sln and .csproj (game-ci handles licensing)
      - name: Generate solution
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.read.outputs.version }}
          targetPlatform: StandaloneLinux64
          buildMethod: Packages.Rider.Editor.RiderScriptEditor.SyncSolution
          allowDirtyBuild: true
          versioning: None
          customImage: unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3

      - name: Verify generated files
        run: |
          find . -maxdepth 1 \( -name "*.sln" -o -name "*.csproj" \) | head -5
          ls *.sln || { echo "No .sln found!"; exit 1; }

      # Step 2: Run sonar analysis inside the SAME Docker image
      #         so all /opt/unity/... paths in .csproj are valid
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e SONAR_TOKEN \
            unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3 \
            bash -c '
              set -euo pipefail

              # ── Install Java 17 ──
              apt-get update -qq
              apt-get install -y --no-install-recommends openjdk-17-jre-headless
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

              # ── Install .NET SDK 8 ──
              wget -q https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
              export PATH="/usr/share/dotnet:$PATH"
              export DOTNET_ROOT="/usr/share/dotnet"

              # ── Install sonarscanner (from /tmp to avoid csproj confusion) ──
              cd /tmp
              dotnet tool install dotnet-sonarscanner --tool-path /sonarscanner
              cd /project

              # ── Point to Mono reference assemblies ──
              export FrameworkPathOverride=/opt/unity/Editor/Data/MonoBleedingEdge/lib/mono/4.7.1-api/

              # ── Strip source generators and Unity compiler overrides ──
              sed -i "/<Analyzer Include=/d" *.csproj
              sed -i "/<CscToolExe>/d" *.csproj
              sed -i "/<CscToolPath>/d" *.csproj

              # ── Find the .sln ──
              SLN_FILE=$(find . -maxdepth 1 -name "*.sln" | head -n 1)
              echo "Building $SLN_FILE"

              # ── Sonar begin ──
              /sonarscanner/dotnet-sonarscanner begin \
                /k:"JuveNILE-games_Mystery_of_the_Scarab" \
                /o:"juvenile-games" \
                /d:sonar.token="$SONAR_TOKEN" \
                /d:sonar.host.url="https://sonarcloud.io" \
                /d:sonar.exclusions="**/Library/**,**/Temp/**,**/obj/**,**/Logs/**,**/UserSettings/**,**/Audio/**" \
                /d:sonar.sources="Assets"

              # ── Build ──
              dotnet build "$SLN_FILE" --configuration Debug --no-incremental

              # ── Sonar end ──
              /sonarscanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
            '
