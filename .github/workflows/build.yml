name: SonarQube

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Parse Unity version
        id: read
        run: |
          VERSION=$(sed -n 's/^m_EditorVersion: //p' \
                   ProjectSettings/ProjectVersion.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                       /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Generate solution
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ steps.read.outputs.version }}
          targetPlatform: StandaloneLinux64
          buildMethod: Packages.Rider.Editor.RiderScriptEditor.SyncSolution
          allowDirtyBuild: true
          versioning: None
          customImage: unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3

      - name: Verify generated files
        run: |
          echo "=== Generated files ==="
          find . -maxdepth 1 \( -name "*.sln" -o -name "*.csproj" \) -print
          echo ""
          echo "Total: $(find . -maxdepth 1 \( -name '*.sln' -o -name '*.csproj' \) | wc -l) files"
          ls *.sln || { echo "No .sln found!"; exit 1; }

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            -e SONAR_TOKEN \
            unityci/editor:ubuntu-${{ steps.read.outputs.version }}-base-3 \
            bash -c '
              set -euo pipefail

              # ── Install Java 17 ──
              apt-get update -qq
              apt-get install -y --no-install-recommends openjdk-17-jre-headless
              export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

              # ── Install .NET SDK 8 ──
              wget -q https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              /tmp/dotnet-install.sh --channel 8.0 --install-dir /usr/share/dotnet
              export PATH="/usr/share/dotnet:$PATH"
              export DOTNET_ROOT="/usr/share/dotnet"

              # ── Install sonarscanner ──
              cd /tmp
              dotnet tool install dotnet-sonarscanner --tool-path /sonarscanner
              cd /github/workspace

              # ── Strip source generators and Unity compiler overrides ──
              sed -i "/<Analyzer Include=/d" *.csproj
              sed -i "/<CscToolExe>/d" *.csproj
              sed -i "/<CscToolPath>/d" *.csproj

              # ── Remove projects that cannot compile ──
              # Try building, extract failing projects, exclude them, retry
              SLN_FILE=$(find . -maxdepth 1 -name "*.sln" | head -n 1)
              MAX_RETRIES=5

              for attempt in $(seq 1 $MAX_RETRIES); do
                echo ""
                echo "=== Build attempt $attempt ==="

                BUILD_OUTPUT=$(dotnet build "$SLN_FILE" --configuration Debug --no-incremental 2>&1) || true

                # Extract unique failing .csproj files from error lines
                FAILING=$(echo "$BUILD_OUTPUT" \
                  | grep ": error CS" \
                  | grep -oP "\[.*?\.csproj\]" \
                  | tr -d "[]" \
                  | sort -u || true)

                if [ -z "$FAILING" ]; then
                  echo "Build succeeded!"
                  break
                fi

                if [ "$attempt" -eq "$MAX_RETRIES" ]; then
                  echo "Still failing after $MAX_RETRIES attempts:"
                  echo "$FAILING"
                  exit 1
                fi

                # Exclude each failing project
                for proj_path in $FAILING; do
                  proj_file=$(basename "$proj_path")
                  proj_name="${proj_file%.csproj}"
                  echo "Excluding failing project: $proj_name"
                  sed -i "/\"${proj_name}.csproj\"/d" "$SLN_FILE"
                  rm -f "$proj_file"
                done
              done

              echo ""
              echo "=== Final projects ==="
              find . -maxdepth 1 -name "*.csproj" -print

              # ── Now do the real sonar build ──
              /sonarscanner/dotnet-sonarscanner begin \
                /k:"JuveNILE-games_Mystery_of_the_Scarab" \
                /o:"juvenile-games" \
                /d:sonar.token="$SONAR_TOKEN" \
                /d:sonar.host.url="https://sonarcloud.io" \
                /d:sonar.exclusions="**/Library/**,**/Temp/**,**/obj/**,**/Logs/**,**/UserSettings/**,**/Audio/**"

              dotnet build "$SLN_FILE" --configuration Debug --no-incremental

              /sonarscanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
            '
